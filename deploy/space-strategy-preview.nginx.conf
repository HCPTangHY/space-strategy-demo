# Included within the existing files.zhenxia.top server block.
location = /space-strategy {
    return 302 /space-strategy/;
}

location = /space-strategy/api/ws {
    proxy_pass http://127.0.0.1:18422/api/ws;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
}

location ^~ /space-strategy/api/ {
    proxy_pass http://127.0.0.1:18421/api/;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    client_max_body_size 1k;
    add_header Cache-Control "no-store" always;
}

location ^~ /space-strategy/ {
    alias /www/wwwroot/space-strategy/dist/;
    index index.html;
    autoindex off;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' wss://files.zhenxia.top; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
}
